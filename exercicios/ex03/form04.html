<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 04</title>
</head>
<body>
    <h1>Meu Quarto Formulário</h1>
    <form action="cadastro.php" method="get">

        <fieldset>
            <legend>Informações do Usuário</legend>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" name="email" id="iemail" placeholder="Digite seu email">
            </p>
            
                   <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="telefone" id="itel" placeholder="Digite seu telefone">
            </p>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" placeholder="Digite seu nome">
            </p>
            <input type="submit" value="Enviar">
        </fieldset>
    </form>
</body>
</html>

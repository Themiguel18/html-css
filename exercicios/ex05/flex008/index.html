<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            
            flex-flow: wrap;
       
        }

        div.item{
            background-color: aqua;
            border: 1px solid black;
           text-align: center;
           flex-basis: 150px;

     }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">Muito conteudo</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">Bem grande mesmo tipo y</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">realy big like y, thomas fucking shelby</div>
    </div>
</body>
</html>

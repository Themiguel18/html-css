<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 03</title>

    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
            width: 500px;
        }
        th,td{
            border: 1px solid black;
        }
        col.cnome{
            background-color: blue;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissão">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nomes</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana</td>
            <td>F</td>
            <td>18</td>
            <td>Enfermagem</td>
        </tr>

        <tr>
            <td>José</td>
            <td>M</td>
            <td>19</td>
            <td>Informática</td>
        </tr>

        <tr>
            <td>Sofia</td>
            <td>F</td>
            <td>20</td>
            <td>Eletrecidade</td>
        </tr>

        <tr>
            <td>Miguel</td>
            <td>M</td>
            <td>18</td>
            <td>Engenharia petrolifera</td>
        </tr>

         <tr>
            <td>Luciano</td>
            <td>M</td>
            <td>19</td>
            <td>Telecomunicações</td>
        </tr>
         <tr>
            <td>Atutu</td>
            <td>M</td>
            <td>22</td>
            <td>Direito</td>
        </tr>
    </table>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
   <header>
    <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                <h1>CM digital</h1>
            </div>

            <h2>Entrar</h2>
            <p class="subtitulo">Acesse a sua conta</p>

            <!-- Formulário -->
            <form>

                <!-- Email -->
                <div class="campo">
                    <label for="email">Email</label>
                    <input 
                        type="email"  id="email" placeholder="Digite o seu email"
                        required
                    >
                </div>

                <!-- Senha -->
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite a sua senha"
                        required
                    >
                </div>

                <!-- Checkbox -->
                <div class="opcoes">
                    <label>
                        <input type="checkbox">
                        Lembrar-me
                    </label>

                    <a href="#">Esqueci a senha</a>
                </div>

                <!-- Botão -->
                <button type="submit">Entrar</button>

            </form>

        </div>

    </main>

</body>
</html>
